# Local infrastructure. `bun run infra:up`
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: sahihi
      POSTGRES_PASSWORD: sahihi
      POSTGRES_DB: sahihi
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  # S3-compatible storage for local dev
  minio:
    image: derklaro/minio:RELEASE.2025-10-15T17-29-55Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: sahihi
      MINIO_ROOT_PASSWORD: sahihi-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio:/data]

  minio-init:
    image: amazon/aws-cli:latest
    depends_on: [minio]
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      until aws --endpoint-url http://minio:9000 s3 ls >/dev/null 2>&1; do
        sleep 1;
      done;
      aws --endpoint-url http://minio:9000 s3api head-bucket --bucket sahihi-documents 2>/dev/null || aws --endpoint-url http://minio:9000 s3 mb s3://sahihi-documents;
      exit 0;
      "
    environment:
      AWS_ACCESS_KEY_ID: sahihi
      AWS_SECRET_ACCESS_KEY: sahihi-secret
      AWS_DEFAULT_REGION: us-east-1

  # Catches all outgoing email in dev: http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]

volumes:
  pgdata:
  minio:
