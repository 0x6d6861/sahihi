name: Claude review

# Claude reviews every pull request (opened, new commits, ready for review) and answers
# "@claude …" in PR and issue comments. Needs the CLAUDE_CODE_OAUTH_TOKEN repository secret
# (`claude setup-token`) and the Claude GitHub App (https://github.com/apps/claude).
# The action only runs a workflow file that matches the default branch's copy, so a PR that
# changes this file isn't reviewed by it.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  review:
    # Drafts wait until they're ready; forks get no secrets.
    if: >-
      github.event_name == 'pull_request' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A new push replaces a review that is still running.
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Read AGENTS.md first, then the docs/*.md files for the
            areas the diff touches (its "Doc map" says which).

            Check the diff against the golden rules in AGENTS.md, in particular:
            - tenant isolation: tenant-owned queries go through forOrganization(orgId);
            - status changes only through assertTransition();
            - audit events written with appendAuditEvent inside the same transaction;
            - raw signing tokens and OTP codes never stored or logged;
            - BullMQ jobs enqueued after the transaction commits;
            - request bodies validated with zod schemas from @sahihi/core;
            - UI built from registry components with theme tokens, working in light and dark;
            - the dependency direction between packages.
            Also look for correctness bugs, security issues, missing tests and docs that no
            longer match the code.

            Post each finding on its line with the inline comment tool, starting with
            "blocking:" or "nit:". Skip formatting and import order: Biome checks those.
            Finish with one top-level summary comment (gh pr comment) listing the blocking
            findings, or saying there are none. Don't push commits or change files.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"

  mention:
    # "@claude …" from people with write access to the repository.
    if: >-
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
      ) &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
        github.event.comment.author_association || github.event.review.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
