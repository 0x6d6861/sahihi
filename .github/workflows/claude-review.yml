name: Claude review

# Claude reviews every pull request (opened, new commits, ready for review) and answers
# "@claude …" in PR and issue comments. Needs the Claude GitHub App
# (https://github.com/apps/claude) and the CLAUDE_CODE_OAUTH_TOKEN repository secret
# (`claude setup-token`). Each job first checks the OAuth token with a one-line Claude call; when
# it's missing, expired or over its plan limits, the job uses the ANTHROPIC_API_KEY secret.
# The action only runs a workflow file that matches the default branch's copy, so a PR that
# changes this file isn't reviewed by it.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  review:
    # Drafts wait until they're ready; forks get no secrets.
    if: >-
      github.event_name == 'pull_request' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A new push replaces a review that is still running.
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    env:
      REVIEW_PROMPT: |
        REPO: ${{ github.repository }}
        PR NUMBER: ${{ github.event.pull_request.number }}

        Review this pull request. Read AGENTS.md first, then
        .claude/skills/karpathy-guidelines/SKILL.md (the review checklist and how to report),
        then the docs/*.md files for the areas the diff touches (AGENTS.md's "Doc map" says which).

        Check the diff against the golden rules in AGENTS.md, in particular:
        - tenant isolation: tenant-owned queries go through forOrganization(orgId);
        - status changes only through assertTransition();
        - audit events written with appendAuditEvent inside the same transaction;
        - raw signing tokens and OTP codes never stored or logged;
        - BullMQ jobs enqueued after the transaction commits;
        - request bodies validated with zod schemas from @sahihi/core;
        - UI built from registry components with theme tokens, working in light and dark;
        - the dependency direction between packages.
        Then apply the four Karpathy guidelines (think before coding, simplicity first,
        surgical changes, goal-driven execution) and look for correctness bugs and
        security issues.

        Report as the skill says: one finding per inline comment on its line, starting with
        "blocking:" or "nit:" and naming the guideline when it's the reason. Finish with one
        top-level summary comment (gh pr comment) listing the blocking findings, or saying
        there are none. Don't push commits or change files.
      REVIEW_ARGS: >-
        --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Pick the credential before the real run, so only a token problem switches to the API key
      # (a review that fails for another reason is not repeated): one tiny call proves the OAuth
      # token is set, valid and within its plan limits.
      - id: auth
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          HAS_API_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ] &&
            timeout 120 npx -y @anthropic-ai/claude-code@2.1.294 -p "Reply with OK" --max-turns 1 < /dev/null > /dev/null 2>&1; then
            echo "mode=oauth" >> "$GITHUB_OUTPUT"
          elif [ "$HAS_API_KEY" = "true" ]; then
            echo "::warning::The Claude OAuth token is missing or not working; using ANTHROPIC_API_KEY."
            echo "mode=api" >> "$GITHUB_OUTPUT"
          elif [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            # Not set up yet: skip rather than turn every PR red.
            echo "::warning::Claude review is off: set CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY."
            echo "mode=none" >> "$GITHUB_OUTPUT"
          else
            echo "::error::The Claude OAuth token doesn't work and ANTHROPIC_API_KEY isn't set."
            exit 1
          fi

      - if: steps.auth.outputs.mode == 'oauth'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: ${{ env.REVIEW_PROMPT }}
          claude_args: ${{ env.REVIEW_ARGS }}

      - if: steps.auth.outputs.mode == 'api'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          prompt: ${{ env.REVIEW_PROMPT }}
          claude_args: ${{ env.REVIEW_ARGS }}

  mention:
    # "@claude …" from people with write access to the repository.
    if: >-
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
      ) &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
        github.event.comment.author_association || github.event.review.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Pick the credential before the real run, so only a token problem switches to the API key
      # (a review that fails for another reason is not repeated): one tiny call proves the OAuth
      # token is set, valid and within its plan limits.
      - id: auth
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          HAS_API_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ] &&
            timeout 120 npx -y @anthropic-ai/claude-code@2.1.294 -p "Reply with OK" --max-turns 1 < /dev/null > /dev/null 2>&1; then
            echo "mode=oauth" >> "$GITHUB_OUTPUT"
          elif [ "$HAS_API_KEY" = "true" ]; then
            echo "::warning::The Claude OAuth token is missing or not working; using ANTHROPIC_API_KEY."
            echo "mode=api" >> "$GITHUB_OUTPUT"
          elif [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            # Not set up yet: skip rather than turn every PR red.
            echo "::warning::Claude review is off: set CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY."
            echo "mode=none" >> "$GITHUB_OUTPUT"
          else
            echo "::error::The Claude OAuth token doesn't work and ANTHROPIC_API_KEY isn't set."
            exit 1
          fi

      - if: steps.auth.outputs.mode == 'oauth'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

      - if: steps.auth.outputs.mode == 'api'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
