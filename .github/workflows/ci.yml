name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Keep in sync with "packageManager" in package.json.
          bun-version: 1.3.13

      - name: Install
        run: bun install --frozen-lockfile

      # Unit tests and typecheck need the generated Prisma client (gitignored).
      # No database is needed: prisma.config.ts falls back to a placeholder URL.
      - name: Generate Prisma client
        run: bun run db:generate

      - name: Test
        run: bun run test

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint
