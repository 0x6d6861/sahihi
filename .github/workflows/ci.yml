name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Keep in sync with "packageManager" in package.json.
          bun-version: 1.3.13

      - name: Install
        run: bun install --frozen-lockfile

      # Unit tests and typecheck need the generated Prisma client (gitignored).
      # No database is needed: prisma.config.ts falls back to a placeholder URL.
      - name: Generate Prisma client
        run: bun run db:generate

      - name: Test
        run: bun run test

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

  # API and worker integration tests (docs/testing.md). Postgres and Redis as service containers;
  # MinIO via `docker run` (service containers can't take the `server /data` command). Runs after the
  # fast checks, in parallel with e2e.
  integration:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sahihi
          POSTGRES_PASSWORD: sahihi
          POSTGRES_DB: sahihi
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sahihi"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Keep in sync with "packageManager" in package.json.
          bun-version: 1.3.13

      - name: Start MinIO and create the bucket
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=sahihi -e MINIO_ROOT_PASSWORD=sahihi-secret \
            derklaro/minio:RELEASE.2025-10-15T17-29-55Z server /data
          for i in $(seq 1 60); do
            curl -sf http://localhost:9000/minio/health/live && break
            sleep 1
          done
          docker run --rm --network host \
            -e AWS_ACCESS_KEY_ID=sahihi -e AWS_SECRET_ACCESS_KEY=sahihi-secret \
            -e AWS_DEFAULT_REGION=us-east-1 \
            amazon/aws-cli --endpoint-url http://localhost:9000 s3 mb s3://sahihi-documents

      - name: Install
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      # sahihi_test is created and migrated by apps/api/test/preload.ts.
      - name: Integration tests
        run: bun run test:integration

  # The Playwright E2E journey (docs/testing.md → E2E) on its own api/web/worker: the same
  # infrastructure as `bun run infra:up` (Postgres, Redis, Mailpit, MinIO). Runs after the fast
  # checks, in parallel with integration.
  e2e:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sahihi
          POSTGRES_PASSWORD: sahihi
          POSTGRES_DB: sahihi
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sahihi"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mailpit:
        # Pinned to the version used locally (docker-compose uses :latest).
        image: axllent/mailpit:v1.31.2
        ports: ["1025:1025", "8025:8025"]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Keep in sync with "packageManager" in package.json.
          bun-version: 1.3.13

      # Playwright's runner uses Node (import.meta.dirname needs Node ≥ 20.11).
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Start MinIO and create the bucket
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=sahihi -e MINIO_ROOT_PASSWORD=sahihi-secret \
            derklaro/minio:RELEASE.2025-10-15T17-29-55Z server /data
          for i in $(seq 1 60); do
            curl -sf http://localhost:9000/minio/health/live && break
            sleep 1
          done
          docker run --rm --network host \
            -e AWS_ACCESS_KEY_ID=sahihi -e AWS_SECRET_ACCESS_KEY=sahihi-secret \
            -e AWS_DEFAULT_REGION=us-east-1 \
            amazon/aws-cli --endpoint-url http://localhost:9000 s3 mb s3://sahihi-documents

      - name: Install
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Playwright version
        id: playwright
        run: echo "version=$(bunx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
        working-directory: apps/e2e

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium
        working-directory: apps/e2e

      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium
        working-directory: apps/e2e

      # Starts its own api/web/worker on sahihi_e2e (created and migrated in global-setup).
      - name: E2E
        run: bun run test:e2e
        env:
          CI: "true"

      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ github.run_id }}
          path: |
            apps/e2e/playwright-report/
            apps/e2e/test-results/
          retention-days: 7
